# ⚠ EL SITIO PASÓ A SER UN EXPORT ESTÁTICO (`output: "export"` en next.config.ts,
# para poder hostearlo en Hostinger sin proceso Node — ver deploy/README-hostinger.md).
#
# Consecuencia para ESTE deploy: ya no hay runtime de Next acá. No hay SSR, ni
# middleware, ni route handlers → **/api/unidades, /api/avance y /api/contact no
# existen en Netlify**. O sea: sin data en vivo de Airtable y sin formulario de
# contacto. El resto del sitio (recorrido, fichas, planos, 360°) funciona completo
# con los datos horneados en el build.
#
# Para que este deploy vuelva a tener data en vivo y formulario, apuntalo al proxy
# PHP de Hostinger con la env del build:
#   NEXT_PUBLIC_API_BASE=https://<dominio-hostinger>/api
# y agregá el origen de Netlify a `allowed_origins` en showroom-config.php (ahí sí
# hace falta CORS, porque son dominios distintos).
#
# Lo de abajo SÍ sigue aplicando: son reglas de CDN (post-procesado de Netlify), no
# del server de Next.
[build]
  command = "npm run build"
  # El export deja todo en out/. Explícito para no depender de la autodetección.
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# ESTE DEPLOY NO SE INDEXA.
#
# El sitio de producción es https://tierbravo.kuvus.app (Hostinger). Acá se sirve el
# MISMO HTML pero con canonical a sí mismo (SITE_URL cae a `process.env.URL`, que en
# Netlify es el dominio de Netlify), así que para Google eran dos sitios con el mismo
# contenido compitiendo por las mismas queries. Verificado el 05-09-2026: respondía 200,
# indexable y con sus 65 URLs en su propio sitemap.
#
# Si algún día este pasa a ser el deploy productivo: sacar este bloque y cargar
# NEXT_PUBLIC_SITE_URL con el dominio definitivo en las envs del sitio.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Cache larga para los assets del flyby (frames + stills). El runtime de Next sirve
# /public con `max-age=0, must-revalidate`, y ni next.config>headers() ni public/_headers
# lo override-an en Netlify (verificado por curl: seguía en max-age=0). Declarado acá
# (nivel CDN, post-procesado por Netlify) sí pisa el default → los frames se sirven de
# cache sin re-bajar por red tras un rato idle (evita el lag/teletransporte). Sin
# `immutable` (las URLs no tienen hash); SWR propaga renders nuevos tras un deploy.
[[headers]]
  for = "/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"

[[headers]]
  for = "/stops/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"

# Renders de la galería. Faltaban acá: `next.config.ts > headers()` declara la regla
# pero en Netlify NO se aplica a /public (los estáticos los sirve el CDN, no el server
# de Next — está verificado por curl, ver el comentario de arriba), así que se servían
# con `max-age=0, must-revalidate`. Son 14 renders (~7 MB) y CUATRO de ellos se bajan
# en el hero de cada unidad sin recorrido 360°, en cada visita.
[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"

# Assets de la INTRO (portada "/"): viven en /public root, así que sin esto caen al
# default de Netlify (max-age=0, must-revalidate) y Safari (más estricto revalidando)
# rechequea el video en cada visita y en cada back desde /showroom. Misma cache larga
# que frames/stops. Sin `immutable` (los nombres no tienen hash); SWR propaga un
# re-encode del mismo nombre en segundo plano.
[[headers]]
  for = "/intro.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"

[[headers]]
  for = "/intro-mobile.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"

[[headers]]
  for = "/intro-poster.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"
