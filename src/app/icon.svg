<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Favicon de marca: la "T" de TIER en oro sobre el grafito de la marca.
       El glifo es el PATH REAL del logotipo del cliente (primera letra de
       _media-src/logos/tier-negro.svg), reescalado — no una T de una fuente
       cualquiera, así el favicon y el wordmark son la misma letra.
       A 16px un wordmark completo sería una mancha: va sólo la inicial. -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0F0F11"/>
  <g transform="translate(9.24 -0.55) scale(0.16899)">
    <path d="M148,120.45V287.28H121.13V120.45H43.88V97.92H225.47v22.53Z" fill="#BF9753"/>
  </g>
</svg>
